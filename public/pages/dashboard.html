<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HRMS — Dashboard</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components/button.css" />
  <link rel="stylesheet" href="/css/layout.css" />
</head>
<body>
  <aside class="sidebar">
    <h2>HRMS</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="leave.html">Leave Requests</a>
      <a href="payroll.html">Payroll</a>
      <a href="performance.html">Performance</a>
      <a href="documents.html">Documents & AI</a>
    </nav>
    <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 1rem;">
      <p style="font-size: 0.9rem; margin-bottom: 0.5rem;" id="user-name">Loading...</p>
      <button class="btn" id="logout-btn" style="width: 100%;">Sign out</button>
    </div>
  </aside>
  <main class="content">
    <h1>Welcome Back</h1>
    <div class="card">
      <h3>Today's Attendance</h3>
      <p id="today" style="color: var(--muted); font-size: 0.9rem;"></p>
      <p>Total Sessions: <strong id="attendance">0</strong></p>
      <button class="btn" id="clock-in">Clock in</button>
      <button class="btn" id="clock-out">Clock out</button>
    </div>
  </main>
  <script type="module">
    import { apiFetch } from '/js/core/api.js';
    import { initLayout } from '/js/core/layout.js';
    initLayout();
    document.getElementById('today').textContent = new Date().toLocaleDateString();

    (async () => {
      const sessions = await apiFetch('/attendance/me');
      document.getElementById('attendance').textContent = sessions.length;
    })();

    document.getElementById('clock-in').onclick = async () => { await apiFetch('/attendance/clock-in', { method: 'POST', body: '{}' }); alert('Clocked in'); location.reload(); };
    document.getElementById('clock-out').onclick = async () => { await apiFetch('/attendance/clock-out', { method: 'POST', body: '{}' }); alert('Clocked out'); location.reload(); };
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    const socket = io();
    socket.on("leave:new", (data) => {
      alert("🔔 REAL-TIME ALERT: " + data.name + " just requested leave!");
    });
  </script>
</body>
</html>
