<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HRMS — Leave</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components/button.css" />
  <link rel="stylesheet" href="/css/layout.css" />
</head>
<body>
  <aside class="sidebar">
    <h2>HRMS</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="analytics.html">Analytics</a>
            <a href="employees.html">Employees</a>
      <a href="attendance.html">Attendance</a>
      <a href="profile.html">My Profile</a>
      <a href="leave.html">Leave Requests</a>
      <a href="payroll.html">Payroll</a>
      <a href="performance.html">Performance</a>
      <a href="documents.html">Documents & AI</a>
    </nav>
    <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 1rem;">
      <p style="font-size: 0.9rem; margin-bottom: 0.5rem;" id="user-name"></p>
      <button class="btn" id="logout-btn" style="width: 100%;">Sign out</button>
    </div>
  </aside>
  <main class="content">
    <h1>Leave Management</h1>
    <div class="card">
      <h3>Request Time Off</h3>
      <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
        <select id="leave-type"></select>
        <input type="date" id="leave-start" />
        <input type="date" id="leave-end" />
        <button class="btn" id="request-leave-btn">Request Leave</button>
      </div>
    </div>
    <div class="card">
      <h3>My Requests</h3>
      <ul id="leave-list" style="list-style: none; padding: 0;"></ul>
    </div>
    <div id="admin-approvals" class="card" style="display: none;">
      <h3>Manager Approvals (Admin Only)</h3>
      <ul id="pending-list" style="list-style: none; padding: 0;"></ul>
    </div>
  </main>
  <script type="module">
    import { apiFetch } from '/js/core/api.js';
    import { initLayout } from '/js/core/layout.js';
    initLayout();

    async function loadLeaveTypes() {
      const types = await apiFetch('/leave/types');
      document.getElementById('leave-type').innerHTML = types.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    }

    async function loadMyLeaves() {
      const leaves = await apiFetch('/leave/requests/me');
      const list = document.getElementById('leave-list');
      if (!leaves.length) return list.innerHTML = '<li>No requests yet.</li>';
      list.innerHTML = leaves.map(l => `
        <li style="padding: 0.5rem 0; border-bottom: 1px solid var(--border);">
          ${new Date(l.startDate).toLocaleDateString()} - ${new Date(l.endDate).toLocaleDateString()} 
          <strong style="color: ${l.status==='APPROVED'?'green':'orange'}; margin-left:1rem;">${l.status}</strong>
        </li>
      `).join('');
    }

    async function loadPending() {
      const role = JSON.parse(atob(sessionStorage.getItem('access').split('.')[1])).role;
      if (role !== 'ADMIN' && role !== 'HR_MANAGER') return;
      document.getElementById('admin-approvals').style.display = 'block';
      
      const requests = await apiFetch('/leave/requests/pending');
      const list = document.getElementById('pending-list');
      if (!requests.length) return list.innerHTML = '<li>No pending requests.</li>';
      list.innerHTML = requests.map(r => `
        <li style="padding: 0.5rem 0; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between;">
          <span>${r.employee.firstName} ${r.employee.lastName} (${r.leaveType.name})</span>
          <button class="btn" onclick="approve('${r.id}')" style="padding: 0.2rem 0.5rem;">Approve</button>
        </li>
      `).join('');
    }

    window.approve = async (id) => {
      await apiFetch(`/leave/requests/${id}/approve`, { method: 'POST' });
      alert('Approved!');
      loadMyLeaves(); loadPending();
    };

    document.getElementById('request-leave-btn').onclick = async () => {
      const start = document.getElementById('leave-start').value;
      const end = document.getElementById('leave-end').value;
      if (!start || !end) return alert('Select dates');
      await apiFetch('/leave/requests', { method: 'POST', body: JSON.stringify({ leaveTypeId: document.getElementById('leave-type').value, startDate: new Date(start).toISOString(), endDate: new Date(end).toISOString() }) });
      alert('Requested!');
      loadMyLeaves(); loadPending();
    };

    loadLeaveTypes(); loadMyLeaves(); loadPending();
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    const socket = io();
    socket.on("leave:new", (data) => {
      alert("🔔 REAL-TIME ALERT: " + data.name + " just requested leave!");
      loadPending();
    });
  </script>
</body>
</html>
