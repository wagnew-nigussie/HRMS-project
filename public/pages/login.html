<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HRMS — Sign in</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components/button.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }
    .card {
      background: var(--surface); padding: 2rem; border-radius: 12px;
      width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.35rem; }
    .error { color: var(--danger); margin-top: .75rem; font-size: .9rem; }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <h1>Sign in to HRMS</h1>
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password" />
    <button class="btn btn-primary" type="submit">Sign in</button>
    <div class="error" id="error" hidden></div>
  </form>
  <script type="module" src="/js/modules/auth.js"></script>
</body>
</html>
