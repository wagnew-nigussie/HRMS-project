<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HRMS — Performance</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components/button.css" />
  <link rel="stylesheet" href="/css/layout.css" />
</head>
<body>
  <aside class="sidebar">
    <h2>HRMS</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="leave.html">Leave Requests</a>
      <a href="payroll.html">Payroll</a>
      <a href="performance.html">Performance</a>
      <a href="documents.html">Documents & AI</a>
    </nav>
    <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 1rem;">
      <p style="font-size: 0.9rem; margin-bottom: 0.5rem;" id="user-name"></p>
      <button class="btn" id="logout-btn" style="width: 100%;">Sign out</button>
    </div>
  </aside>
  <main class="content">
    <h1>Performance (OKRs)</h1>
    <div class="card">
      <h3>Add New Goal</h3>
      <div style="display: flex; gap: 1rem;">
        <input type="text" id="okr-input" placeholder="e.g. Learn Node.js" style="flex-grow: 1;" />
        <button class="btn" id="add-okr-btn">Add Goal</button>
      </div>
    </div>
    <div class="card">
      <h3>My Goals</h3>
      <ul id="okr-list" style="list-style: none; padding: 0;"></ul>
    </div>
  </main>
  <script type="module">
    import { apiFetch } from '/js/core/api.js';
    import { initLayout } from '/js/core/layout.js';
    initLayout();

    async function loadOkrs() {
      const okrs = await apiFetch('/performance/okrs/me');
      const list = document.getElementById('okr-list');
      if (!okrs.length) return list.innerHTML = '<li>No goals set.</li>';
      list.innerHTML = okrs.map(o => `<li style="padding: 0.5rem 0; border-bottom: 1px solid var(--border);"><strong>${o.objective}</strong> — ${Math.round(Number(o.progress)*100)}%</li>`).join('');
    }

    document.getElementById('add-okr-btn').onclick = async () => {
      const input = document.getElementById('okr-input');
      if (!input.value) return;
      await apiFetch('/performance/okrs', { method: 'POST', body: JSON.stringify({ objective: input.value }) });
      input.value = '';
      loadOkrs();
    };
    loadOkrs();
  </script>
</body>
</html>
