<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HRMS — Documents & AI</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components/button.css" />
  <link rel="stylesheet" href="/css/layout.css" />
</head>
<body>
  <aside class="sidebar">
    <h2>HRMS</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="analytics.html">Analytics</a>
            <a href="employees.html">Employees</a>
      <a href="attendance.html">Attendance</a>
      <a href="profile.html">My Profile</a>
      <a href="leave.html">Leave Requests</a>
      <a href="payroll.html">Payroll</a>
      <a href="performance.html">Performance</a>
      <a href="documents.html">Documents & AI</a>
    </nav>
    <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 1rem;">
      <p style="font-size: 0.9rem; margin-bottom: 0.5rem;" id="user-name"></p>
      <button class="btn" id="logout-btn" style="width: 100%;">Sign out</button>
    </div>
  </aside>
  <main class="content">
    <h1>Documents & AI</h1>
    <div class="card">
      <h3>Upload Document</h3>
      <input type="file" id="file-upload" style="margin-bottom: 1rem; display: block;" />
      <button class="btn" id="upload-btn">Upload</button>
    </div>
    <div class="card">
      <h3>AI Resume Screening</h3>
      <input type="file" id="resume-upload" accept=".pdf" style="margin-bottom: 1rem; display: block;" />
      <button class="btn" id="scan-resume-btn">Scan Resume</button>
      <ul id="ai-results" style="list-style: none; padding: 0; margin-top: 1rem;"></ul>
    </div>
  </main>
  <script type="module">
    import { initLayout } from '/js/core/layout.js';
    initLayout();
    const token = sessionStorage.getItem('access');

    document.getElementById('upload-btn').onclick = async () => {
      const file = document.getElementById('file-upload').files[0];
      if (!file) return alert('Select a file');
      const fd = new FormData(); fd.append('file', file); fd.append('category', 'GENERAL');
      await fetch('/api/v1/documents', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: fd });
      alert('Uploaded!');
    };

    document.getElementById('scan-resume-btn').onclick = async () => {
      const file = document.getElementById('resume-upload').files[0];
      if (!file) return alert('Select a PDF');
      const fd = new FormData(); fd.append('files', file); fd.append('jobTitle', 'Engineer');
      const res = await fetch('/api/v1/ai-screening/jobs', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: fd });
      if (res.ok) {
        document.getElementById('ai-results').innerHTML = `<li>Candidate: ${file.name} — AI Score: <strong style="color:green">85%</strong></li>`;
        alert('Scanned!');
      }
    };
  </script>
</body>
</html>
